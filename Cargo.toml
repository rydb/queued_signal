[package]
name = "queued_signal"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = {workspace = true, features = ["desktop"]}
dioxus-core = {workspace = true}
arc-swap = {workspace = true}
flume = {workspace = true}
tokio = {workspace = true}
flashmap = {workspace = true}
bevy_ecs = {workspace = true}
