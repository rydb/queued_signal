[workspace]
resolver = "3"
members = ["./crates/*", "examples", "queued_signal", "crates/queued_signal_tracing"]


[workspace.dependencies]
dioxus_bevy_signals = {path = "crates/dioxus_bevy_signals", default-features = false}
queued_signal_tracing = { path = "crates/queued_signal_tracing" }

dioxus = {version = "=0.8.0-alpha.3", default-features = false}
dioxus-core = {version = "=0.8.0-alpha.3"}
dioxus-signals = {version = "=0.8.0-alpha.3"}
dioxus-document = {version = "=0.8.0-alpha.3"}
dioxus-hooks = {version = "=0.8.0-alpha.3"}
dioxus-native = {version = "=0.8.0-alpha.3", default-features = false}
dioxus-history = {version = "=0.8.0-alpha.3"}
generational-box = {version = "=0.8.0-alpha.3"}
dioxus-html = {version = "=0.8.0-alpha.3"}

flume = {version = "0.12"}
anyhow = "1"
tokio = "1.51"
parking_lot = "0.13.0"
kovan = "0.2.2"
ptr_meta = "0.3.2"
imbl = "7"

bevy_ecs = {version = "0.20"}
bevy_app = {version = "0.20"}
bevy_asset = {version = "0.20"}
bevy_color = {version = "0.20"}
bevy_pbr = {version = "0.20"}
bevy_transform = {version = "0.20"}
bevy_time = {version = "0.20"}
bevy_log = {version = "0.20"}
bevy_reflect = {version = "0.20"}
bevy_ptr = {version = "0.20"}
tracing = { version = "0.1", default-features = false, features = ["std"] }
glam = {version = "0.32"}
trait-set = {version = "0.3"}
bytemuck = {version = "1.25", features = ["derive"]}
variadics_please = "2.0.0"
queued_signal = {path = "./queued_signal"}
left-right = "0.11.7"
cfg-if = "1.0"
macro-v = "0.1.4"
pastey = "0.2.3"
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }

winit = "0.31.0-beta.3"
parley = { version = "0.12", features = ["std"] }
tracing-subscriber = "0.3"
tracing-chrome = "0.7"

