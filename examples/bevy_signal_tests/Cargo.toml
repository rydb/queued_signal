[package]
name = "bevy_signal_tests"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_app = {workspace = true}
bevy_ecs = {workspace = true, features = ["trace"]}
bevy_time = {workspace = true}
bevy_log = {workspace = true}
bevy_color = {workspace = true}
bevy_pbr = {workspace = true}
dioxus-core = {workspace = true}
bevy_asset = {workspace = true}
dioxus-hooks = {workspace = true}
dioxus-document = {workspace = true}
dioxus-signals = {workspace = true}
dioxus = {workspace = true, features = ["lib", "desktop", "document", "devtools", "launch"]}
flume = {workspace = true}
queued_signal = {workspace = true}
dioxus_bevy_signals = {workspace = true}
parking_lot = {workspace = true}
tokio = {workspace = true}
cfg-if = {workspace = true}
tracing-subscriber = {workspace = true}
tracing-chrome = {workspace = true}
sysinfo = "0.39.3"

[features]
trace = ["dioxus_bevy_signals/trace"]
resource_tests = ["dioxus_bevy_signals/resource", "trace"]
query_tests = ["dioxus_bevy_signals/query", "trace"]
asset_tests = ["dioxus_bevy_signals/asset", "dioxus_bevy_signals/query", "trace"]
default = ["resource_tests", "query_tests", "asset_tests"]